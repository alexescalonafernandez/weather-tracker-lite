name: Publish Container Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.metadata.outputs.image_digest }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Sign in to Azure with publisher identity
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_PUBLISHER_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate configured registry
        shell: bash
        run: |
          if [ -z "${{ vars.AZURE_ACR_NAME }}" ] || [ -z "${{ vars.AZURE_ACR_LOGIN_SERVER }}" ]; then
            printf 'AZURE_ACR_NAME and AZURE_ACR_LOGIN_SERVER repository variables are required.\n' >&2
            exit 1
          fi

      - name: Authenticate Docker to registry
        shell: bash
        run: az acr login --name "${{ vars.AZURE_ACR_NAME }}"

      - name: Build and push source-tagged image
        shell: bash
        run: |
          image="${{ vars.AZURE_ACR_LOGIN_SERVER }}/weather-tracker-lite:${GITHUB_SHA}"
          docker build --tag "$image" .
          docker push "$image"

      - name: Resolve immutable image digest
        id: metadata
        shell: bash
        run: |
          image="weather-tracker-lite:${GITHUB_SHA}"
          image_digest="$(az acr repository show --name "${{ vars.AZURE_ACR_NAME }}" --image "$image" --query digest --output tsv)"

          if [[ ! "$image_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            printf 'Registry did not return a valid SHA-256 image digest.\n' >&2
            exit 1
          fi

          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "image_tag=${GITHUB_SHA}"
            echo "image_digest=$image_digest"
          } > image-provenance.txt

      - name: Upload image provenance
        uses: actions/upload-artifact@v4
        with:
          name: image-provenance
          path: image-provenance.txt
          if-no-files-found: error
